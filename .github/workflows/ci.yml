#grant minimal read only permission to repository contents
permissions:
    contents: read

#define the automated jobs that run on Github-hosted virtual machines
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22
            
            - name: run unit & physics verification tests
              run: npm test



#workflow name displayed in the github actions tab and status badge
name: CI

#trigger this pipeline automatically on every push or pull request to the main branch
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
